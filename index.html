<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF8F4">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="تحدي القدم السكرية">
  <meta name="format-detection" content="telephone=no">
  <title>تحدي القدم السكرية</title>
  <link rel="apple-touch-icon" href="assets/img/app-icon-180.png">
  <link rel="icon" type="image/png" href="assets/img/app-icon-192.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/motion.css">
  <script>
    // set theme + language before first paint (no flash)
    (function () {
      var d = document.documentElement, t = null, l = 'ar';
      try { t = localStorage.getItem('dfc.theme'); l = localStorage.getItem('dfc.lang') || 'ar'; } catch (e) {}
      if (t !== 'dark' && t !== 'light') { try { t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { t = 'light'; } }
      d.setAttribute('data-theme', t);
      if (l === 'en') { d.lang = 'en'; d.dir = 'ltr'; }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brand">
      <img class="brand-logo" data-logo="logo-primary" src="assets/img/logo-primary-navy.png" alt="جبيرة JABIRA" width="587" height="180" draggable="false">
    </div>
    <div class="controls">
      <button type="button" class="ctrl" data-action="lang"></button>
      <button type="button" class="ctrl" data-action="theme"></button>
      <button type="button" class="ctrl" data-action="sound"></button>
    </div>
  </header>

  <main id="main">
    <!-- 1. الصفحة الرئيسية -->
    <section id="screen-home" class="screen" aria-labelledby="home-title">
      <div class="home-grid">
        <div class="hero">
          <span class="eyebrow"><svg class="trace" viewBox="0 0 46 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M1 2v4l6 6h31"/><circle cx="41" cy="12" r="3" fill="currentColor" stroke="none"/></svg><span data-i18n="eyebrow"></span></span>
          <h1 id="home-title" data-i18n="appTitle" tabindex="-1"></h1>
          <p class="tagline" data-i18n="heroQuestion"></p>
          <p class="desc" data-i18n="heroDesc"></p>
          <ul class="facts" id="facts"></ul>
          <div class="hero-actions">
            <button type="button" class="btn btn-primary btn-xl" id="btn-start"></button>
            <div class="closed-note" id="closed-note" hidden></div>
          </div>
        </div>
        <aside class="card board" aria-labelledby="board-title-home">
          <div class="board-head"><span id="board-icon-home"></span><h2 id="board-title-home" data-i18n="top5"></h2></div>
          <ol class="board-list" id="board-home"></ol>
        </aside>
        <div class="band home-band" aria-hidden="true"></div>
      </div>
    </section>

    <!-- 2. تسجيل المتسابق -->
    <section id="screen-register" class="screen" hidden aria-labelledby="reg-title">
      <div class="register-wrap">
        <form class="card register-card" id="form-register" novalidate autocomplete="off">
          <span class="eyebrow"><svg class="trace" viewBox="0 0 46 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M1 2v4l6 6h31"/><circle cx="41" cy="12" r="3" fill="currentColor" stroke="none"/></svg><span data-i18n="appTitle"></span></span>
          <h1 id="reg-title" data-i18n="registerTitle" tabindex="-1"></h1>
          <p class="desc" data-i18n="registerDesc"></p>
          <div class="field">
            <label for="name" data-i18n="nameLabel"></label>
            <input class="input" id="name" name="player" type="text" maxlength="40" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="words" enterkeyhint="go" data-i18n-ph="namePlaceholder" aria-describedby="name-error">
            <p class="greet" id="greet" aria-live="polite" hidden></p>
            <p class="field-error" id="name-error" role="alert" hidden></p>
          </div>
          <div class="actions-row">
            <button type="submit" class="btn btn-primary btn-lg" id="btn-begin"></button>
            <button type="button" class="btn btn-secondary btn-lg" id="btn-reg-back"></button>
          </div>
        </form>
      </div>
    </section>

    <!-- 3. الأسئلة -->
    <section id="screen-quiz" class="screen" hidden aria-labelledby="q-text">
      <div class="quiz">
        <div class="quiz-top">
          <div class="progress">
            <span class="progress-label" id="q-progress-label"></span>
            <div class="steps" id="q-steps" role="progressbar" aria-valuemin="1" aria-valuemax="3"><div class="step"><i></i></div><div class="step"><i></i></div><div class="step"><i></i></div></div>
          </div>
          <div class="timer" id="timer">
            <span class="timer-chip" id="timer-chip" hidden></span>
            <div class="timer-ring" role="timer" id="timer-ring">
              <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="44" fill="none" stroke-width="9"/><circle class="bar" id="timer-bar" cx="50" cy="50" r="44" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg>
              <div class="val"><span class="num" id="timer-val">30</span><small id="timer-unit"></small></div>
            </div>
          </div>
        </div>
        <div class="card qcard" id="qcard">
          <div class="qhead">
            <div class="warning" id="q-warning" hidden></div>
            <h2 class="qtext" id="q-text" tabindex="-1"></h2>
            <div class="qhint"><span id="q-hint"></span><span class="count" id="q-count" aria-live="polite"></span></div>
          </div>
          <ul class="options" id="q-options"></ul>
          <div class="qfoot">
            <button type="button" class="btn btn-primary btn-lg btn-confirm" id="btn-confirm" disabled></button>
          </div>
        </div>
      </div>
    </section>

    <!-- 4. النتائج -->
    <section id="screen-results" class="screen" hidden aria-labelledby="res-name">
      <div class="results-grid">
        <div class="card result-card">
          <span class="eyebrow"><svg class="trace" viewBox="0 0 46 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M1 2v4l6 6h31"/><circle cx="41" cy="12" r="3" fill="currentColor" stroke="none"/></svg><span data-i18n="resultsEyebrow"></span></span>
          <h1 class="result-name" id="res-name" tabindex="-1"></h1>
          <div class="score-hero">
            <span class="score-big num" id="res-score">0</span>
            <span class="score-out" data-i18n="outOf"></span>
          </div>
          <div class="score-track" aria-hidden="true"><i id="res-bar"></i></div>
          <p class="result-msg" id="res-msg"></p>
          <div class="stats" id="res-stats"></div>
          <p class="bonus-line" id="res-bonus"></p>
        </div>
        <div class="results-side">
          <div id="res-congrats"></div>
          <aside class="card board" aria-labelledby="board-title-res">
            <div class="board-head"><span id="board-icon-res"></span><h2 id="board-title-res" data-i18n="top5"></h2></div>
            <ol class="board-list" id="board-res"></ol>
          </aside>
          <button type="button" class="btn btn-primary btn-lg" id="btn-home"></button>
          <div class="band results-band" aria-hidden="true"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="overlay" id="overlay" hidden role="alertdialog" aria-modal="true" aria-labelledby="overlay-title">
    <div class="overlay-box"><span id="overlay-icon"></span><h2 id="overlay-title"></h2><p id="overlay-text"></p></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/i18n.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
